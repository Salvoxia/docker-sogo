apiVersion: batch/v1
kind: CronJob
metadata:
  name: sogo-every-minute
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:      
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sogo
              image: salvoxia/sogo
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command:
                - sh
              args:
                - -c
                # Run Session expiry and Email Alarms jobs after starting up the daemon, the container runs as user 'sogo'
                - /start.sh && /usr/local/sbin/sogo-tool expire-sessions 60 && /usr/local/sbin/sogo-ealarms-notify
              env:
                # Only the commands above are run, no cron jobs
                - name: CRON_TMPWATCH
                  value: "0"
              ports:
              - containerPort: 8080
                name: http
                protocol: TCP
              resources: {}
              volumeMounts:
              - mountPath: /srv/etc
                name: config
          volumes:
            - name: config
              configMap:
                name: sogo-config
          restartPolicy: Never