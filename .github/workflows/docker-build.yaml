---
# Reusable workflow building, testing and publishing the multi-arch image
#
# Each platform is built natively on its own runner. When publishing, every platform image is
# pushed untagged (by digest), pulled back by that digest and tested. Only if all platforms pass,
# the merge job combines the tested digests into a multi-arch image and pushes the tags.
# Without publishing, each platform image is only built and tested locally.
name: docker-build

'on':
  workflow_call:
    inputs:
      push:
        description: Publish the image to the registries
        type: boolean
        required: true
      tags:
        description: Tag rules for docker/metadata-action
        type: string
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        run: |
          image_name=$(sed -E 's/docker-//' <<<"${GITHUB_REPOSITORY,,}")
          echo "GHCR_IMAGE=ghcr.io/${image_name}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=docker.io/${image_name}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Build for testing only
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: sogo:e2e

      - name: Run end-to-end test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$DIGEST" ]; then
            # Test exactly the image that was pushed
            image="${GHCR_IMAGE}@${DIGEST}"
            docker pull "$image"
          else
            image=sogo:e2e
          fi
          ./tests/e2e.sh "$image"

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set image names
        run: |
          image_name=$(sed -E 's/docker-//' <<<"${GITHUB_REPOSITORY,,}")
          echo "GHCR_IMAGE=ghcr.io/${image_name}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=docker.io/${image_name}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker tag names
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: ${{ inputs.tags }}

      - name: Create multi-arch image and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.meta.outputs.version }}"
