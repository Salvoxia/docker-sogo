---
# Builds and tests the image for pull requests, pushes to main and tags.
# Any other branch can be built manually via workflow_dispatch.
# Publishes the image only for
#   - tags: with the tag name and "latest"
#   - pushes to main: with "edge"
name: CI

'on':
  pull_request:
  push:
    branches:
      - main
    # paths-ignore does not apply to tags
    paths-ignore:
      - 'README.md'
    tags:
      - '[0-9]+.*'
  workflow_dispatch:

# Cancel outdated runs of a pull request, but never runs that publish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit
    with:
      # Push events are only triggered for main and tags
      push: ${{ github.event_name == 'push' }}
      # generate Docker tags based on the following events/attributes
      tags: |
        # edge tag for pushes to main
        type=edge,branch=main
        # tag name for tags
        type=match,pattern=([0-9]+.*),group=1
        # latest tag for tags
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
